name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-release VERSION even if its tag already exists"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION, tag, and CHANGELOG
        id: check
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VERSION' is not valid semver (expected X.Y.Z)"
            exit 1
          fi

          if [ "${{ inputs.force }}" != "true" ]; then
            if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::tag ${TAG} already exists; bump VERSION or re-run with force=true"
              exit 1
            fi
          fi

          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a '## [${VERSION}]' section"
            exit 1
          fi

  verify:
    name: Verify
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse Go version from mise.toml
        id: go-version
        run: echo "version=$(grep '^go' mise.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: go test
        run: go test -race ./...

  publish:
    name: Publish
    needs: [gate, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse Go version from mise.toml
        id: go-version
        run: echo "version=$(grep '^go' mise.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Build and package
        run: |
          BIN=openbao-plugin-secrets-onepassword
          mkdir -p assets
          for GOARCH in amd64 arm64; do
            OUTDIR=$(mktemp -d)
            CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH \
              go build -trimpath -ldflags "-s -w" -o "$OUTDIR/$BIN" ./cmd/$BIN
            ASSET="${BIN}_${VERSION}_linux_${GOARCH}.tar.gz"
            tar -C "$OUTDIR" -czf "assets/${ASSET}" "$BIN"
          done
          cd assets
          for ASSET in *.tar.gz; do
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          done
          ls -la

      - name: Create or move tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.force }}" = "true" ]; then
            git tag -f "$TAG"
            git push --force origin "$TAG"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create or update GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --generate-notes
          else
            gh release create "$TAG" assets/* --title "$TAG" --generate-notes --target "${{ github.sha }}"
          fi

  proxy-warm:
    name: Warm Go module proxy
    needs: [gate, publish]
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse Go version from mise.toml
        id: go-version
        run: echo "version=$(grep '^go' mise.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Warm proxy.golang.org
        run: GOPROXY=https://proxy.golang.org go list -m github.com/NavistAu/openbao-plugin-secrets-onepassword@${{ needs.gate.outputs.tag }}
